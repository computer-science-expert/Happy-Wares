<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop | Happy Wares</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <h1>Happy Wares</h1>
    <p>Shop Smart • Compare Better</p>
  </header>

  <!-- NAVIGATION -->
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="products.html">Shop</a>
  </nav>

  <!-- SEARCH & FILTER -->
<input type="text" id="searchInput" placeholder="Search products...">

<select id="categoryFilter">
  <option value="All">All Categories</option>
</select>
  
  <!-- PRODUCTS -->
  <section class="products">
    
    <section class="products" id="productList"></section>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];
const container = document.getElementById("productList");
const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");

function isAdmin() {
  return localStorage.getItem("isAdmin") === "true";
}

// Populate category filter dynamically
const categories = [...new Set(products.map(p => p.category).filter(c => c))];
categories.forEach(cat => {
  categoryFilter.innerHTML += `<option value="${cat}">${cat}</option>`;
});

// Render products
function renderProducts() {
  const searchTerm = searchInput.value.toLowerCase();
  const selectedCategory = categoryFilter.value;

  container.innerHTML = "";

  products.forEach((p, index) => {
    if(
      (selectedCategory === "All" || p.category === selectedCategory) &&
      p.name.toLowerCase().includes(searchTerm)
    ){
      container.innerHTML += `
        <div class="product">
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p>₹${p.price}</p>
          <a class="btn" href="${p.link}" target="_blank">Buy Now</a>
          ${isAdmin() ? `<button onclick="editProduct(${index})">Edit</button>
          <button onclick="deleteProduct(${index})">Delete</button>` : ""}
        </div>
      `;
    }
  });
}

// Edit & Delete functions
function editProduct(index) {
  if(!isAdmin()) return;
  const p = products[index];
  const name = prompt("Edit product name:", p.name);
  if(name === null) return;
  const price = prompt("Edit price:", p.price);
  if(price === null) return;
  const image = prompt("Edit image URL:", p.image);
  if(image === null) return;
  const link = prompt("Edit affiliate link:", p.link);
  if(link === null) return;
  const category = prompt("Edit category:", p.category);
  if(category === null) return;

  products[index] = { name, price, image, link, category };
  localStorage.setItem("products", JSON.stringify(products));
  renderProducts();
}

function deleteProduct(index) {
  if(!isAdmin()) return;
  if(confirm("Delete this product?")) {
    products.splice(index,1);
    localStorage.setItem("products", JSON.stringify(products));
    renderProducts();
  }
}

// Event listeners for search and filter
searchInput.addEventListener("input", renderProducts);
categoryFilter.addEventListener("change", renderProducts);

// Initial render
renderProducts();
</script>

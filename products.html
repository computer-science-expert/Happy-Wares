<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop | Happy Wares</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <h1>Happy Wares</h1>
    <p>Shop Smart • Compare Better</p>
  </header>

  <!-- NAVIGATION -->
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="products.html">Shop</a>
  </nav>

  <!-- PRODUCTS -->
  <section class="products">

    <section class="products" id="productList"></section>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];
const container = document.getElementById("productList");

function renderProducts() {
  container.innerHTML = "";

  products.forEach((p, index) => {
    container.innerHTML += `
      <div class="product">
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p>₹${p.price}</p>
        <a class="btn" href="${p.link}" target="_blank">Buy Now</a>

        ${isAdmin() ? `
  <button onclick="editProduct(${index})">Edit</button>
  <button onclick="deleteProduct(${index})">Delete</button>
` : ""}
      </div>
    `;
  });
}

function deleteProduct(index) {
  if (confirm("Delete this product?")) {
    products.splice(index, 1);
    localStorage.setItem("products", JSON.stringify(products));
    renderProducts();
  }
}

function editProduct(index) {
  const p = products[index];

  const newName = prompt("Edit product name:", p.name);
  if (newName === null) return;

  const newPrice = prompt("Edit price:", p.price);
  if (newPrice === null) return;

  const newImage = prompt("Edit image URL:", p.image);
  if (newImage === null) return;

  const newLink = prompt("Edit affiliate link:", p.link);
  if (newLink === null) return;

  products[index] = {
    name: newName,
    price: newPrice,
    image: newImage,
    link: newLink
  };

  localStorage.setItem("products", JSON.stringify(products));
  renderProducts();
}

renderProducts();

function isAdmin() {
  return localStorage.getItem("isAdmin") === "true";
}
</script>

  </section>

  <!-- FOOTER -->
 <footer class="footer">
  <p>© 2026 Happy Wares</p>
  <p>
    <a href="affiliate.html">Affiliate Disclosure</a> |
    <a href="privacy.html">Privacy Policy</a> |
    <a href="disclaimer.html">Disclaimer</a>
  </p>
</footer>

</body>
</html>

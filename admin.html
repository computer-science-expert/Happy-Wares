<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel | Happy Wares</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; }
    button { background: black; color: white; border: none; }
  </style>
</head>
<body>

<h2>Add New Product</h2>

<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price (₹)">
<input id="category" placeholder="Category (e.g., Electronics)">
<input id="image" placeholder="Image URL">
<input id="link" placeholder="Affiliate Link">

<button onclick="addProduct()">Add Product</button>
  
<br><br>
<button onclick="adminLogin()">Admin Login</button>
<button onclick="logout()">Logout</button>  

<script>
const password = prompt("Enter admin password to access this page:");
if(password !== "hap8874py") {
  alert("Wrong password! Redirecting...");
  window.location.href = "products.html";
}

function addProduct() {
  const product = {
    name: document.getElementById("name").value,
    price: document.getElementById("price").value,
    image: document.getElementById("image").value,
    link: document.getElementById("link").value,
    category: document.getElementById("category").value
  };

  let products = JSON.parse(localStorage.getItem("products")) || [];
  products.push(product);
  localStorage.setItem("products", JSON.stringify(products));

  alert("Product Added!");
  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("image").value = "";
  document.getElementById("link").value = "";
  document.getElementById("category").value = "";
}
  
  function adminLogin() {
  const password = prompt("Enter admin password:");

  if (password === "hap8874py") {
    localStorage.setItem("isAdmin", "true");
    alert("Admin access granted");
  } else {
    alert("Wrong password");
  }
}

function logout() {
  localStorage.removeItem("isAdmin");
  alert("Logged out successfully");
  window.location.href = "products.html";
}
</script>
  
<script type="module">
  import { addProduct } from "./firebase.js";

  window.addProduct = async function () {
    const name = document.getElementById("name").value;
    const price = document.getElementById("price").value;
    const image = document.getElementById("image").value;
    const link = document.getElementById("link").value;
    const category = document.getElementById("category").value || "general";

    if (!name || !price || !image || !link) {
      alert("Fill all fields");
      return;
    }

    await addProduct({
      name,
      price: Number(price),
      image,
      link,
      category
    });

    alert("Product added ✅");

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("image").value = "";
    document.getElementById("link").value = "";
    document.getElementById("category").value = "";
  };
</script>
  
</body>
</html>

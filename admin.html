<h2>Add New Product</h2>

<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price (₹)">
<input id="category" placeholder="Category (e.g., Electronics)">
<input id="image" placeholder="Image URL">
<input id="link" placeholder="Affiliate Link">

<button onclick="addProduct()">Add Product</button>
  
<br><br>

<script type="module">
const password = prompt("Enter admin password to access this page:");
if(password !== "hap8874py") {
  alert("Wrong password! Redirecting...");
  window.location.href = "products.html";
}

function addProduct() {
  const product = {
    name: document.getElementById("name").value,
    price: document.getElementById("price").value,
    image: document.getElementById("image").value,
    link: document.getElementById("link").value,
    category: document.getElementById("category").value
  };

  import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

async function addProduct() {
  const nameValue = document.getElementById("name").value;
  const priceValue = document.getElementById("price").value;
  const imageValue = document.getElementById("image").value;
  const linkValue = document.getElementById("link").value;
  const categoryValue = document.getElementById("category").value || "general";

  if (!nameValue || !priceValue || !imageValue || !linkValue) {
    alert("Please fill all required fields!");
    return;
  }

  try {
    await addDoc(collection(db, "products"), {
      name: nameValue,
      price: Number(priceValue),
      image: imageValue,
      link: linkValue,
      category: categoryValue,
      createdAt: serverTimestamp()
    });

    alert("Product added to Firebase successfully ✅");

    // Clear input fields
    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("image").value = "";
    document.getElementById("link").value = "";
    document.getElementById("category").value = "";

  } catch (error) {
    console.error("Error adding product: ", error);
    alert("Failed to add product ❌ Check console for details");
  }
}

  alert("Product Added!");
  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("image").value = "";
  document.getElementById("link").value = "";
  document.getElementById("category").value = "";
}
  
  function adminLogin() {
  const password = prompt("Enter admin password:");

  if (password === "hap8874py") {
    localStorage.setItem("isAdmin", "true");

}

function logout() {
  localStorage.removeItem("isAdmin");
  alert("Logged out successfully");

}
